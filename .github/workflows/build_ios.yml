name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Telefono AI v5.2.0 — Sync Google Calendar 1-Tap, Copilot Live HUD Sala Operativa Terni & CmapTools (.IPA)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.2.0' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Telefono AI v5.2.0: Google Calendar 1-Tap & Copilot Live HUD Sala Operativa

            ### 🌟 Novità assolute in questa versione:
            1. 📅 **Modulo A — Sync Google Calendar Istantaneo (1-Tap)**:
               - Riconoscimento automatico di appuntamenti, prenotazioni e visite mediche/lavorative da Gemini.
               - Pulsante **"Aggiungi a Google Calendar"** sia nella scheda chiamata che nella timeline/agenda.
               - Apre direttamente l'app Google Calendar o la schermata web ufficiale con data, ora, titolo, luogo e dettagli già precompilati in 1 tocco!
            2. 🏢 **Modulo B — Copilot Live HUD (Sala Operativa Terni & Procedure Emergenza)**:
               - Knowledge Base documentale integrata in locale nell'app per la Sala Operativa di Terni (protocolli allerta meteo, soglie Fiume Nera, linee COC 0744 549111/549888, Piano RIR Polo Chimico/Acciaierie).
               - Riconoscimento vocale live delle parole chiave durante la telefonata: se l'interlocutore pone domande su allerta, COC, esondazioni o emergenze, compare un banner HUD dinamico ad alto contrasto.
               - Toccando il banner o il pulsante rapido `[ 🏢 Sala Operativa (HUD) ]` si apre il foglio con i punti chiave esatti da riferire immediatamente alla persona al telefono.
            3. 🎙️ **Player Audio MP3 con Cache Locale & AudioSession Fix**:
               - Riascolto istantaneo delle chiamate Asterisk ad alto volume anche con iPhone su switch silenzioso.
            4. 🗺️ **Mappe CmapTools & Cronologia a Calendario**:
               - Raggruppamento delle chiamate per data e orario con nodi concettuali CmapTools.
            
            ### 📲 Installazione su iPhone con Sideloadly:
            1. Scarica `AetherPulse.ipa` qui sotto dagli Assets della release.
            2. Aprilo con Sideloadly su Windows con cavo USB.
            3. Inserisci il tuo Apple ID e premi Start.
            4. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza l'app.
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
