name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Synapse Kinetic Life OS (v2.0.0 .IPA)
          tag_name: v2.0.0
          draft: false
          prerelease: false
          body: |
            ## 🌟 Synapse: Kinetic Life OS - iOS Release (.ipa)
            
            Compiled automatically with GitHub Actions on macOS without requiring a local Mac.
            
            ### 📱 What makes Synapse unique:
            - **Orbital Reality Matrix**: Your day is a kinetic solar system governed by real orbital mechanics.
            - **Supernova Dopamine Absorption**: Complete tasks by absorbing them with an explosive particle burst and haptic feedback.
            - **120s Neural Ignition**: Destroy task inertia with the neuroscience-backed 2-minute friction breaker.
            - **Circadian Bio-Battery**: Real-time 24h biological capacity telemetry.
            - **Kinetic Thought Void**: Elastic memory bubbles bouncing in an antigravity chamber.
            
            ### 📲 How to Install on iPhone:
            1. Download `AetherPulse.ipa` below.
            2. Sideload with Sideloadly (Windows/Mac, free) or AltStore.
            3. On iPhone: Settings > General > VPN & Device Management > Trust.
            4. Enjoy 120 FPS kinetic physics on your iPhone!
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
