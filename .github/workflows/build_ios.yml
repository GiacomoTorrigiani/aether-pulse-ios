name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Telefono AI v5.4.0 — Chiama per Me: Ottimizzatore Bozza Gemini & Agente Telefonico con Voce Clonata (.IPA)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.4.0' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Telefono AI v5.4.0: Chiama per Me con Voce IA & Ottimizzatore Bozza Gemini

            ### 🌟 Novità assolute in questa versione:
            1. ✍️ **Area di Testo Libero ("Scrivi Veloce")**:
               - Scrivi qualsiasi richiesta o obiettivo in modo veloce, anche con abbreviazioni, errori o senza punteggiatura (es. *"chiama il dentista chiedi se ha posto giovedi mattina verso le 11 x pulizia denti e quanto costa"*).
            2. ✨ **Ottimizzazione & Correzione Istantanea con Gemini**:
               - Il modello Gemini analizza la bozza ed elabora all'istante:
                 - **Frase di Apertura Naturale**: Cosa dirà l'assistente con la tua voce non appena l'altra persona risponde.
                 - **Obiettivo della Telefonata**: Cosa ottenere e chiarire.
                 - **Punti Chiave & Istruzioni di Fallback**: Come rispondere prontamente e in modo del tutto coerente se l'interlocutore fa domande, propone orari alternativi o chiede chiarimenti.
            3. 🎙️ **Ascolta con la tua Voce Clonata (ElevenLabs)**:
               - Tasto rapido per ascoltare in anteprima l'audio sintetizzato prima di avviare la chiamata.
            4. 📞 **Chiamata Autonoma & Monitor Live**:
               - Avvio della telefonata tramite Asterisk con la voce clonata di Giacomo (`xEzOS5e97wrbq2qesDb4`).
               - Monitoraggio passo-passo della conversazione e salvataggio esiti.
            5. 📅 **Sync Google Calendar (1-Tap)**:
               - Pulsante a fine chiamata per registrare l'appuntamento concordato direttamente sul tuo calendario!
            
            ### 📲 Installazione su iPhone con Sideloadly:
            1. Scarica `AetherPulse.ipa` qui sotto dagli Assets della release.
            2. Aprilo con Sideloadly su Windows con cavo USB.
            3. Inserisci il tuo Apple ID e premi Start.
            4. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza l'app.
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
