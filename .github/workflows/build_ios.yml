name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Telefono AI — Dialpad, Vivavoce & Mappe Post-Chiamata (v4.0.0 .IPA)
          tag_name: v4.0.0
          draft: false
          prerelease: false
          body: |
            ## 📱 Telefono AI: Tastierino Reale, Registrazione Vivavoce & Appunti Post-Chiamata (.ipa)
            
            Compiled automatically with GitHub Actions on macOS without requiring a Mac.
            
            ### 🌟 Funzionalità Principali v4.0.0:
            1. **📞 Tastierino Telefonico Apple (Dialpad)**: Tastierino numerico 0-9, *, # con avvio chiamate reali GSM (`tel:`) o avvio sessione assistita.
            2. **🎙️ Ascolto e Registrazione Vivavoce Reale**: Attiva il vivavoce e l'app ascolta la conversazione tramite il microfono reale dell'iPhone salvando l'audio in `.m4a`.
            3. **🔊 Riproduzione Audio Forzata ad Alto Volume**: Motore `AVAudioSessionCategory.playAndRecord` per riprodurre le chiamate registrate anche se l'iPhone ha la levetta Mute attiva!
            4. **👤 Rubrica Personale**: Aggiungi qualsiasi contatto con nome e numero di telefono per chiamarlo con 1 tap.
            5. **🧠 Mappa Concettuale & Appunti Post-Chiamata**: Genera automaticamente sunto, decisioni, cose da fare (action items) e mappa concettuale interattiva post-conversazione.
            
            ### 📲 Installazione su iPhone:
            1. Scarica `AetherPulse.ipa` qui sotto.
            2. Installalo con Sideloadly (Windows/Mac) o AltStore.
            3. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza.
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
