name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Telefono AI v5.1.0 — Vista Calendario & Orari, Player Audio MP3 con Cache & Mappe CmapTools (.IPA)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.1.0' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Telefono AI v5.1.0: Calendario Chiamate, Player Audio MP3 & CmapTools
            
            ### 🌟 Novità assolute in questa versione:
            1. 📅 **Vista Calendario & Cronologia Chiamate**: Visualizzazione ordinata per giorno e ore (es. "Oggi • Lunedì 16 Novembre", "Ieri", ecc.) con orario esatto, durata e schede di facile lettura.
            2. 🎙️ **Player Audio Fix 100%**: Download e caching locale ultra-veloce in formato MP3, con configurazione audio `playback` (suona ad alto volume anche con iPhone su Silenzioso/Muto).
            3. 🗺️ **Mappe CmapTools con Schema Relazionale**: Trascrizione integrale reale e generazione del grafo relazionale con proposizioni esplicite (es. prenotazione al Ristorante Il Cicalinono per 4 persone alle ore 21:00).
            4. ⚡ **Sincronizzazione Cloud Istantanea**: Eliminati i doppioni e resa immediata la ricezione delle nuove chiamate registrate da Asterisk.
            
            ### 📲 Installazione su iPhone con Sideloadly:
            1. Scarica `AetherPulse.ipa` qui sotto dagli Assets della release.
            2. Aprilo con Sideloadly su Windows con cavo USB.
            3. Inserisci il tuo Apple ID e premi Start.
            4. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza l'app.
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
