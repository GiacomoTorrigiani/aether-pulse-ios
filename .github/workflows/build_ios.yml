name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Telefono AI v5.6.0 — Ponte Telefonico Reale, Squillo iPhone & Ascolto Live (.IPA)"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.6.0' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Telefono AI v5.6.0: Ponte Reale con Voce Clonata ElevenLabs & Controllo Live

            ### 🚀 Novità Principali in questa versione:
            1. 📞 **Ponte Telefonico a 2 Vie (Squilla Prima il Tuo iPhone)**:
               - Quando premi "Avvia Telefonata con la Mia Voce IA", la VPS chiama prima il tuo iPhone (`3669650010`).
               - Tu rispondi allo squillo della VPS (`0744 1590208`).
               - Asterisk compone immediatamente il destinatario e, non appena risponde, riproduce la tua vera voce clonata da ElevenLabs (`xEzOS5e97wrbq2qesDb4`).
               - **Sei già in linea in diretta!** Ascolti tutto in tempo reale dal tuo iPhone e puoi parlare al microfono quando vuoi intervenire.

            2. ⚡ **Monitoraggio Canali Reale (Nessuna Falsa Simulazione)**:
               - Rimosse tutte le finte attese simulate: l'app interroga in tempo reale lo stato effettivo dei canali SIP di Asterisk tramite `/api/voice-agent/status`.
               - Mostra quando lo squillo è in arrivo sul tuo telefono e quando sei ufficialmente in linea.
               - Pulsante **🔴 Riattacca Telefonata** funzionante in qualsiasi momento sia dall'app che dal tasto rosso del tuo iPhone.

            3. ⌨️ **Gestione Tastiera & Cellulare Perfezionata**:
               - Tasto rapido `[ Chiudi ]` per abbassare la tastiera istantaneamente e modificare il testo.
               - Chiusura automatica toccando qualsiasi punto fuori dal campo o scorrendo verso il basso.
               - Nuovo campo per visualizzare e confermare il tuo numero di cellulare su cui ricevere lo squillo di avvio.

            ### 📲 Installazione su iPhone con Sideloadly / Scarlet / TrollStore:
            1. Scarica `AetherPulse.ipa` qui sotto dagli Assets della release.
            2. Installalo sul tuo iPhone.
            3. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza l'app.
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
