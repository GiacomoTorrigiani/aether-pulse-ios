name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Telefono AI v5.3.0 — Agente Vocale Outbound con Voce Clonata ElevenLabs, Invito Amici RSVP & Prenotazione Cicalino (.IPA)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.3.0' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Telefono AI v5.3.0: Agente Vocale con Voce Clonata, Inviti Cena RSVP & Google Calendar

            ### 🌟 Novità assolute in questa versione:
            1. 🎙️ **Agente Vocale Outbound con Voce Clonata (ElevenLabs)**:
               - Collegamento al motore ElevenLabs con la voce clonata di Giacomo (`xEzOS5e97wrbq2qesDb4`).
               - Pulsante rapido `[ 🍕 Organizza Cena (Voce IA) ]` in cima al tastierino.
               - Player integrato per ascoltare i campioni della voce clonata in alta fedeltà direttamente su iPhone:
                 - *Test Voce Clonata*
                 - *Invito a cena per Mario al Cicalino*
                 - *Prenotazione tavolo per 3 al Ristorante Il Cicalino*
            2. 📞 **Flusso Autonomo Inviti Amici (RSVP)**:
               - Chiamata sequenziale automatica agli amici (Mario, Matteo, Elena).
               - Rilevamento in tempo reale delle risposte (Mario: SÌ, Matteo: SÌ, Elena: NO).
               - **Popup Decisionale Intelligente**: Notifica riassuntiva con conteggio partecipanti confermati e richiesta di conferma per chiamare il ristorante.
            3. 🍕 **Prenotazione Autonoma con la tua Voce al Ristorante Il Cicalino**:
               - Chiamata autonoma con la voce clonata a nome Giacomo Torrigiani per 3 persone alle 20:00.
               - Tasto rapido 1-Tap per aggiungere la cena direttamente su **Google Calendar** con tutti i dettagli!
            4. 📅 **Sync Google Calendar 1-Tap (Modulo A)** & 🏢 **Copilot Live HUD Sala Operativa Terni (Modulo B)**.
            
            ### 📲 Installazione su iPhone con Sideloadly:
            1. Scarica `AetherPulse.ipa` qui sotto dagli Assets della release.
            2. Aprilo con Sideloadly su Windows con cavo USB.
            3. Inserisci il tuo Apple ID e premi Start.
            4. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza l'app.
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
