name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Telefono AI v5.0.0 — Riascolto Audio Chiamate, Mappa CmapTools Flowchart & Web Callback Ponte Automatico (.IPA)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Telefono AI v5.0.0: Riascolto Audio, Mappa CmapTools & Web Callback

            ### 🌟 Novità di questa versione:
            1. 🎙️ **Player Audio Integrato**: Riascolta la registrazione integrale della telefonata tra le due persone direttamente nell'app con seek bar, avanzamento in tempo reale e controllo velocità.
            2. 🗺️ **Mappe Concettuali Stile CmapTools / Flowchart**: Nodi concettuali e archi orientati con etichette di relazione (stile Novak IHMC CmapTools) con pan e pinch-to-zoom.
            3. 🚀 **Ponte AI Automatico (Web Callback)**: Chiama con un solo tocco senza conferenze manuali: la VPS fa squillare il tuo cellulare (366 9650010) e ti unisce al contatto registrando la conversazione.
            4. 🧠 **Motore Google Gemini 3.5 Flash**: Trascrizione automatica, estrazione decisioni e promemoria operativi collegati alla tua chiave API.
            
            ### 📲 Installazione su iPhone con Sideloadly:
            1. Scarica `AetherPulse.ipa` qui sotto dagli Assets.
            2. Aprilo con Sideloadly su Windows con cavo USB.
            3. Inserisci il tuo Apple ID e premi Start.
            4. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza l'app.
            3. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza.
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
