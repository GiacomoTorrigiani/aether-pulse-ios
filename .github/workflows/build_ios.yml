name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Telefono AI — Integrazione Broker Cloud, Configurazione API Centralino & Sincronizzazione Mappe (v4.3.0 .IPA)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v4.3.0' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Telefono AI v4.3.0: Broker Cloud & Configurazione API (.ipa)
            
            Compiled automatically with GitHub Actions on macOS without requiring a Mac.
            
            ### 🌟 Nuove Funzionalità in v4.3.0:
            1. **🌐 Interfaccia Configurazione Broker & API**: Modale dedicato accessibile dalla barra di stato o dal tab Risparmio per configurare l'endpoint del proprio centralino Asterisk, Telnyx o Twilio.
            2. **🔑 Parametri di Connessione Completi**: Configurazione guidata per Server URL, API Secret Token (Bearer), Numero Virtuale DID (Inbound) e Caller ID TIM certificato (Outbound).
            3. **⚡ Test Connessione Ping Live**: Verifica istantanea con feedback visivo della connettività con il server backend VoIP.
            4. **🔄 Sincronizzazione Automatica Registrazioni Cloud**: Con un solo tap su "Sincronizza Cloud" l'app recupera le registrazioni effettuate dal centralino Asterisk/Telnyx e genera immediatamente trascrizioni, appunti e mappe concettuali interattive.
            5. **🖥️ Microserver Broker Python Pronto all'Uso**: Disponibile nello script `server/broker_webhook_server.py` per ricevere i webhook di fine chiamata e trascrivere con Whisper / Gemini AI.
            
            ### 📲 Installazione su iPhone con Sideloadly:
            1. Scarica `AetherPulse.ipa` qui sotto.
            2. Aprilo con Sideloadly su Windows con cavo USB.
            3. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza.
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
