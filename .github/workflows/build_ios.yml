name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VoxMind AI — Call Co-Pilot & Mind Map (v3.0.0 .IPA)
          tag_name: v3.0.0
          draft: false
          prerelease: false
          body: |
            ## 🎙️ VoxMind AI: Real-Time Call Co-Pilot & Dynamic Mind Map (.ipa)
            
            Compiled automatically with GitHub Actions on macOS without requiring a Mac.
            
            ### 🌟 Funzionalità Rivoluzionarie:
            - **Live Call AI Co-Pilot**: Riconosce l'interlocutore, trascrive la chiamata in tempo reale con speaker diarization.
            - **Generatore di Domande Contestuali**: Suggerisce in tempo reale le 3 domande chiave da porre (negoziazione, chiarimento tecnico, chiusura accordo).
            - **Mappa Concettuale Automatica (Interactive Knowledge Graph)**: Genera istantaneamente una mappa ad albero visiva e interattiva di tutto ciò che è stato detto.
            - **Executive Debrief & Action Items**: Sintesi strutturata automatica, decisioni prese e lista delle cose da fare con scadenze, pronta da condividere via WhatsApp o Email.
            
            ### 📲 Installazione su iPhone:
            1. Scarica `AetherPulse.ipa` qui sotto.
            2. Installalo con Sideloadly (Windows/Mac) o AltStore.
            3. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza.
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
