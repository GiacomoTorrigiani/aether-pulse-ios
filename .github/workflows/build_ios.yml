name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VoxMind AI — Call Co-Pilot con Audio Vocale & Rubrica (v3.1.0 .IPA)
          tag_name: v3.1.0
          draft: false
          prerelease: false
          body: |
            ## 🎙️ VoxMind AI: Real-Time Call Co-Pilot con Audio Vocale & Rubrica Personale (.ipa)
            
            Compiled automatically with GitHub Actions on macOS without requiring a Mac.
            
            ### 🌟 Nuove Funzionalità v3.1.0:
            1. **🔊 Motore Audio Vocale Italiano Attivo**: Riproduzione vocale tramite Apple AVSpeechSynthesizer! Ascolta la chiamata o tocca qualsiasi fumetto/domanda per sentirla pronunciare ad alta voce con intonazione naturale.
            2. **👤 Gestione Contatti Personali**: Aggiungi i tuoi veri contatti con Nome, Ruolo, Azienda, Telefono e Argomento della Chiamata. VoxMind genera automaticamente le domande su misura e la mappa concettuale per i tuoi contatti!
            3. **🧠 Mappa Concettuale Automatica (Knowledge Graph)**: Canvas interattivo ad albero di tutto ciò che è stato detto.
            4. **📋 Sunto Esecutivo & Action Items**: Condividi il resoconto completo con 1 tap su WhatsApp/Email.
            
            ### 📲 Installazione su iPhone:
            1. Scarica `AetherPulse.ipa` qui sotto.
            2. Installalo con Sideloadly (Windows/Mac) o AltStore.
            3. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza.
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
