name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Telefono AI — Smart Routing, Esclusioni Numeri & Risparmio Automatico (v4.2.0 .IPA)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v4.2.0' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Telefono AI v4.2.0: Smart Routing & Risparmio Automatico (.ipa)
            
            Compiled automatically with GitHub Actions on macOS without requiring a Mac.
            
            ### 🌟 Novità Assolute in v4.2.0:
            1. **🛡️ Nuovo Tab Dedicato "Risparmio & Routing"**: Interfaccia grafica completa per visualizzare e gestire la lista dei numeri esclusi dal centralino VoIP.
            2. **💰 Calcolatore di Risparmio in Tempo Reale**: Stima della spesa mensile (es. 1,63 €/mese) e calcolo automatico dei soldi risparmiati chiamando i contatti personali direttamente con la SIM TIM gratuita.
            3. **👥 Gestione Esclusioni Diretta in Rubrica**: Ogni contatto in rubrica mostra lo stato attuale (`🛡️ TIM 0€` o `🎙️ AI`) e un pulsante scudo per includere o escludere il contatto con 1 tap.
            4. **🔢 Tastierino Intelligente con Riconoscimento Esclusioni**: Quando digiti un numero escluso (es. `3381764***`), l'app riconosce il prefisso, accende il badge verde e imposta la chiamata diretta TIM a costo zero.
            5. **💾 Persistenza Locale Robusta (`SharedPreferences`)**: I numeri esclusi restano salvati sul dispositivo anche dopo la chiusura dell'app.
            
            ### 📲 Installazione su iPhone con Sideloadly:
            1. Scarica `AetherPulse.ipa` qui sotto.
            2. Aprilo con Sideloadly su Windows con cavo USB.
            3. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza.
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
