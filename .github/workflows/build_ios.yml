name: Build iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Telefono AI v5.5.0 — Controllo Chiamata Live, Prendi Possesso (Barge-In) & Rilevamento Silenzio (.IPA)"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.5.0' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Telefono AI v5.5.0: Turn-Taking con Silenzio, Prendi Possesso & Chiusura Tastiera

            ### 🌟 Novità assolute in questa versione:
            1. ⌨️ **Fix Completo Tastiera**:
               - Risolto il problema della tastiera bloccata a schermo: tocco ovunque sullo sfondo o swipe per chiuderla istantaneamente.
               - Nuovo pulsante dedicato **"Chiudi Tastiera"** per modificare e rivedere il testo in ogni momento.
            2. 🤫 **Turn-Taking Naturale con Rilevamento Silenzio (2 Secondi)**:
               - Il bot parla con la tua voce clonata, poi si ferma e attende che l'interlocutore risponda.
               - Non appena l'altra persona termina di parlare (dopo 2 secondi di silenzio), Gemini elabora la risposta coerente e riprende la conversazione!
            3. 🛑 **Pulsante "Prendi Possesso (Parla Tu)"**:
               - Se vuoi intervenire di persona nella telefonata, premi il pulsante e Asterisk chiama all'istante il tuo cellulare (3669650010), zittisce il bot IA e ti collega direttamente all'interlocutore!
            4. 🔴 **Pulsante "Riattacca" Istantaneo**:
               - Termina immediatamente la telefonata su Asterisk in qualsiasi momento con un solo tocco.
            5. ✨ **Ottimizzatore Bozza Gemini & Voce Clonata ElevenLabs (Giacomo)**.
            
            ### 📲 Installazione su iPhone con Sideloadly:
            1. Scarica `AetherPulse.ipa` qui sotto dagli Assets della release.
            2. Aprilo con Sideloadly su Windows con cavo USB.
            3. Inserisci il tuo Apple ID e premi Start.
            4. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza l'app.
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
