name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer & Tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Build iOS App (Unsigned for Sideloading)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 AetherPulse.ipa Payload
          ls -lh AetherPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPulse-iOS-IPA
          path: AetherPulse.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Telefono AI — Rubrica Reale iPhone, Trascrizione Vocale & Mappe Reali (v4.1.0 .IPA)
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v4.1.0' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 Telefono AI v4.1.0: Rubrica Reale iPhone & Trascrizione Viva Voce (.ipa)
            
            Compiled automatically with GitHub Actions on macOS without requiring a Mac.
            
            ### 🌟 Novità e Risoluzioni in v4.1.0:
            1. **👥 Rubrica Reale iPhone (`CNContactStore`)**: Accesso diretto ai tuoi contatti veri memorizzati su iPhone, con ricerca istantanea e chiamata rapida a 1 tap.
            2. **🗣️ Trascrizione Vocale Live Reale (`speech_to_text`)**: Le parole pronunciate al microfono vengono trascritte e visualizzate a schermo in tempo reale.
            3. **🧠 Mappe Concettuali e Decisioni 100% Reali**: Nessun testo inventato! La mappa concettuale, le decisioni e le azioni da compiere vengono generate dinamicamente a partire dalle parole effettivamente pronunciate.
            4. **⚠️ Trasparenza Sandbox iOS per Chiamate GSM**: Spiegazione e gestione dell'isolamento microfono imposto da Apple durante le telefonate cellulari, con opzione per dettare il memo vocale immediato post-chiamata.
            5. **🔊 Riproduzione Audio Forzata ad Alto Volume**: Motore `AVAudioSessionCategory.playAndRecord` per riprodurre le registrazioni anche con la levetta Muto inserita.
            
            ### 📲 Installazione su iPhone:
            1. Scarica `AetherPulse.ipa` qui sotto.
            2. Installalo con Sideloadly (Windows/Mac) con il tuo Apple ID.
            3. Su iPhone: Impostazioni > Generali > Gestione dispositivo e VPN > Autorizza.
          files: |
            AetherPulse.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
